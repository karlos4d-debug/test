<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¿Cómo sonaba el T-Rex?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --accent: #eab308;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
    }
    header h1 {
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    video {
      width: 100%;
      max-height: 260px;
      background: #000;
      object-fit: contain;
    }
    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .record-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .record-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--danger);
      border: 4px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    .record-btn.recording {
      animation: pulse 1s infinite alternate;
      border-color: white;
      transform: scale(1.05);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      100% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .audio-indicator {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>¿Cómo sonaba el T-Rex?</h1>
    <p>Pregunta, graba la respuesta y mira el resultado</p>
  </header>

  <div class="video-card">
    <video id="tRexVideo" playsinline preload="auto">
      <source src="T-rex%20Roar.mp4" type="video/mp4">
      Tu navegador no soporta vídeo HTML5.
    </video>
  </div>

  <div class="controls-card">
    <div class="record-btn-container">
      <button class="record-btn" id="recordBtn" type="button">
        <span id="recordText">Grabar</span>
      </button>
      <div class="audio-indicator" id="audioIndicator">Pulsa para grabar el sonido cómico</div>
    </div>

    <button class="btn" id="previewBtn" type="button" disabled>
      ▶ Reproducir Broma
    </button>
    <button class="btn btn-success" id="exportBtn" type="button" disabled>
      ⬇ Exportar Vídeo Final
    </button>
  </div>
</div>

<script>
  const video = document.getElementById('tRexVideo');
  const recordBtn = document.getElementById('recordBtn');
  const recordText = document.getElementById('recordText');
  const audioIndicator = document.getElementById('audioIndicator');
  const previewBtn = document.getElementById('previewBtn');
  const exportBtn = document.getElementById('exportBtn');

  const ROAR_START_TIME = 7.0;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordedAudioBlob = null;
  let recordedAudio = null;
  let isRecording = false;

  // 1. Grabación limpia del micrófono (código probado y funcional)
  recordBtn.onclick = async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
          const audioUrl = URL.createObjectURL(recordedAudioBlob);
          recordedAudio = new Audio(audioUrl);

          recordedAudio.onloadedmetadata = () => {
            const sec = recordedAudio.duration.toFixed(1);
            audioIndicator.textContent = `Grabado: ${sec} segundos`;
            previewBtn.disabled = false;
            exportBtn.disabled = false;
          };

          // Fallback por si los metadatos tardan en computarse
          setTimeout(() => {
            if (previewBtn.disabled && recordedAudioBlob.size > 0) {
              audioIndicator.textContent = 'Audio preparado';
              previewBtn.disabled = false;
              exportBtn.disabled = false;
            }
          }, 300);

          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
        recordText.textContent = 'Parar';
        audioIndicator.textContent = 'Grabando... ¡haz el sonido ahora!';
      } catch (err) {
        alert('Error al acceder al micrófono: ' + err.message);
      }
    } else {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordText.textContent = 'Grabar';
    }
  };

  // 2. Previsualización en pantalla
  previewBtn.onclick = () => {
    if (!recordedAudio) return;

    video.currentTime = 0;
    video.volume = 1;
    video.play();

    let swapped = false;

    const onFrame = () => {
      if (video.currentTime >= ROAR_START_TIME && !swapped) {
        swapped = true;
        video.volume = 0;
        recordedAudio.currentTime = 0;
        recordedAudio.play();
      }

      if (!video.paused && !video.ended) {
        requestAnimationFrame(onFrame);
      } else {
        video.volume = 1;
      }
    };

    requestAnimationFrame(onFrame);
  };

  // 3. Exportación del vídeo con corte de audio sincronizado al segundo 7
  exportBtn.onclick = async () => {
    if (!recordedAudioBlob) return;
    exportBtn.disabled = true;
    exportBtn.textContent = 'Generando vídeo...';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dest = audioCtx.createMediaStreamDestination();

    const arrayBuffer = await recordedAudioBlob.arrayBuffer();
    const userAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    const canvasStream = canvas.captureStream(30);
    const outputStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...dest.stream.getAudioTracks()
    ]);

    const mime = (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('video/mp4'))
      ? 'video/mp4'
      : 'video/webm';

    const recorder = new MediaRecorder(outputStream, { mimeType: mime });
    const chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const finalBlob = new Blob(chunks, { type: mime });
      const dlUrl = URL.createObjectURL(finalBlob);
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = `t_rex_broma.${mime === 'video/mp4' ? 'mp4' : 'webm'}`;
      a.click();

      exportBtn.disabled = false;
      exportBtn.textContent = '⬇ Exportar Vídeo Final';
      video.volume = 1;
    };

    recorder.start();
    video.currentTime = 0;
    video.volume = 1;
    video.play();

    let roarTriggered = false;

    const render = () => {
      if (!video.paused && !video.ended) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (video.currentTime >= ROAR_START_TIME && !roarTriggered) {
          roarTriggered = true;
          video.volume = 0;

          const userSource = audioCtx.createBufferSource();
          userSource.buffer = userAudioBuffer;
          userSource.connect(dest);
          userSource.start();
        }

        requestAnimationFrame(render);
      } else {
        recorder.stop();
      }
    };

    requestAnimationFrame(render);
  };
</script>

</body>
</html>
