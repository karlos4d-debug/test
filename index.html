<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¿Cómo sonaba el T-Rex? v2.0</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --accent: #eab308;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
    }
    header h1 {
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    video {
      width: 100%;
      max-height: 260px;
      background: #000;
      object-fit: contain;
    }
    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mode-select {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .mode-select select {
      background: #0b0f19;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .record-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .record-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--danger);
      border: 4px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    .record-btn.recording {
      animation: pulse 1s infinite alternate;
      border-color: white;
      transform: scale(1.05);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      100% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .audio-indicator {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>¿Cómo sonaba el T-Rex? <small style="font-size:0.75rem; color:#22c55e;">v2.0</small></h1>
    <p>Haz una pregunta, graba el sonido y mira el rugido</p>
  </header>

  <div class="video-card">
    <video id="tRexVideo" playsinline preload="auto">
      <source src="T-rex%20Roar.mp4" type="video/mp4">
      Tu navegador no soporta vídeo HTML5.
    </video>
  </div>

  <div class="controls-card">
    <div class="mode-select">
      <label for="shortSoundMode">Si el sonido dura menos de 5 seg:</label>
      <select id="shortSoundMode">
        <option value="cut">Corte cómico (termina al acabar el sonido)</option>
        <option value="loop">Bucle cómico (repite el sonido hasta el final)</option>
        <option value="stretch">Estirar audio (ralentizar sonido)</option>
      </select>
    </div>

    <div class="record-btn-container">
      <button class="record-btn" id="recordBtn">
        <span id="recordIcon">●</span>
        <span id="recordText">Grabar</span>
      </button>
      <div class="audio-indicator" id="audioIndicator">Pulsa para grabar tu sonido cómico</div>
    </div>

    <button class="btn" id="previewBtn" disabled>
      ▶ Reproducir Broma
    </button>
    <button class="btn btn-success" id="exportBtn" disabled>
      ⬇ Exportar Vídeo Final
    </button>
  </div>
</div>

<script>
  const video = document.getElementById('tRexVideo');
  const recordBtn = document.getElementById('recordBtn');
  const recordText = document.getElementById('recordText');
  const audioIndicator = document.getElementById('audioIndicator');
  const previewBtn = document.getElementById('previewBtn');
  const exportBtn = document.getElementById('exportBtn');
  const shortSoundMode = document.getElementById('shortSoundMode');

  const ROAR_START_TIME = 7.0;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordedAudioBlob = null;
  let recordedAudio = null;
  let audioDuration = 0;
  let isRecording = false;

  // 1. Grabación de voz (Bloque exacto que funcionó sin fallos)
  recordBtn.addEventListener('click', async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const audioUrl = URL.createObjectURL(recordedAudioBlob);
          recordedAudio = new Audio(audioUrl);

          recordedAudio.onloadedmetadata = () => {
            audioDuration = recordedAudio.duration;
            audioIndicator.textContent = `Grabado: ${audioDuration.toFixed(1)} segundos`;
            previewBtn.disabled = false;
            exportBtn.disabled = false;
          };

          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
        recordText.textContent = 'Parar';
        audioIndicator.textContent = 'Grabando... ¡haz el sonido ahora!';
      } catch (err) {
        alert('No se pudo acceder al micrófono: ' + err.message);
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordText.textContent = 'Grabar';
    }
  });

  // 2. Previsualización interactiva
  previewBtn.addEventListener('click', () => {
    if (!recordedAudio) return;

    video.currentTime = 0;
    video.volume = 1;
    video.play();

    let audioTriggered = false;

    const checkTime = () => {
      if (video.currentTime >= ROAR_START_TIME && !audioTriggered) {
        audioTriggered = true;
        video.volume = 0;

        const mode = shortSoundMode.value;
        recordedAudio.currentTime = 0;

        if (mode === 'loop') {
          recordedAudio.loop = true;
          recordedAudio.playbackRate = 1.0;
        } else if (mode === 'stretch' && audioDuration < 5) {
          recordedAudio.loop = false;
          recordedAudio.playbackRate = Math.max(0.4, audioDuration / 5);
        } else {
          recordedAudio.loop = false;
          recordedAudio.playbackRate = 1.0;
        }

        recordedAudio.play();

        if (mode === 'cut') {
          recordedAudio.onended = () => {
            setTimeout(() => {
              video.pause();
            }, 400);
          };
        }
      }

      if (!video.paused && !video.ended) {
        requestAnimationFrame(checkTime);
      }
    };

    requestAnimationFrame(checkTime);
  });

  // 3. Exportar vídeo final completo (con sonido de los primeros 7s + audio grabado)
  exportBtn.addEventListener('click', async () => {
    if (!recordedAudioBlob) return;
    exportBtn.disabled = true;
    exportBtn.textContent = 'Procesando vídeo completo...';

    try {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 360;

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();

      // Decodificar tanto el audio del vídeo original como el audio grabado
      const [videoRes, userArrayBuffer] = await Promise.all([
        fetch('T-rex%20Roar.mp4').then(r => r.arrayBuffer()),
        recordedAudioBlob.arrayBuffer()
      ]);

      const [originalVideoAudioBuffer, userAudioBuffer] = await Promise.all([
        audioCtx.decodeAudioData(videoRes),
        audioCtx.decodeAudioData(userArrayBuffer)
      ]);

      const canvasStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);

      const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      const outputChunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) outputChunks.push(e.data);
      };

      recorder.onstop = () => {
        const finalBlob = new Blob(outputChunks, { type: 'video/webm' });
        const downloadUrl = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'broma_t_rex_completa.webm';
        a.click();

        exportBtn.disabled = false;
        exportBtn.textContent = '⬇ Exportar Vídeo Final';
        video.volume = 1;
        audioCtx.close();
      };

      // Preparar audio de los primeros 7 segundos del vídeo original
      const origSource = audioCtx.createBufferSource();
      origSource.buffer = originalVideoAudioBuffer;
      const origGain = audioCtx.createGain();
      origSource.connect(origGain);
      origGain.connect(dest);

      recorder.start();
      video.currentTime = 0;
      video.volume = 0; // Silenciamos el altavoz durante el renderizado porque va por dest
      await video.play();

      // Reproduce el audio original solo desde el segundo 0 hasta el segundo 7.0
      origSource.start(0, 0, ROAR_START_TIME);

      let userAudioStarted = false;
      const mode = shortSoundMode.value;

      const drawFrame = () => {
        if (!video.paused && !video.ended) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          if (video.currentTime >= ROAR_START_TIME && !userAudioStarted) {
            userAudioStarted = true;
            const userSource = audioCtx.createBufferSource();
            userSource.buffer = userAudioBuffer;

            if (mode === 'loop') {
              userSource.loop = true;
            } else if (mode === 'stretch' && userAudioBuffer.duration < 5) {
              userSource.playbackRate.value = Math.max(0.4, userAudioBuffer.duration / 5);
            }

            userSource.connect(dest);
            userSource.start();

            if (mode === 'cut') {
              setTimeout(() => {
                video.pause();
                if (recorder.state !== 'inactive') recorder.stop();
              }, (userAudioBuffer.duration + 0.4) * 1000);
            }
          }

          requestAnimationFrame(drawFrame);
        } else if (mode !== 'cut' || !userAudioStarted) {
          if (recorder.state !== 'inactive') recorder.stop();
        }
      };

      drawFrame();
    } catch (err) {
      alert
